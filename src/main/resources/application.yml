spring:
  application:
    name: enterprise-faq-ai
  main:
    banner-mode: "off"
  messages:
    basename: messages

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

couchbase:
  connection-string: ${COUCHBASE_HOST:localhost}
  username: ${COUCHBASE_USER:admin}
  password: ${COUCHBASE_PASSWORD:password}
  bucket: ${COUCHBASE_BUCKET:faq_bucket}
  scope: ${COUCHBASE_SCOPE:faq_scope}
  collection: ${COUCHBASE_COLLECTION:faqs}

embedding:
  service:
    url: ${EMBEDDING_SERVICE_URL:http://localhost:8000/embed}

faq:
  search:
    index-name: faq_vectors
    vector-field-name: question_vector
    limit: 5
    num-candidates: 50
  match-threshold: ${FAQ_MATCH_THRESHOLD:0.9}
  soft-match-threshold: ${FAQ_SOFT_MATCH_THRESHOLD:0.75}
  fallback:
    number: ${FAQ_FALLBACK_NUMBER:1-800-123-4567}
  hybrid:
    semantic-weight: ${FAQ_SEMANTIC_WEIGHT:0.7}
    lexical-weight: ${FAQ_LEXICAL_WEIGHT:0.3}
